<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- Tray glyph on an 18 unit grid. tools/build_icons.py reads the ids below
       (bars / cursor) to colour and restyle it for each tray state. -->
  <g id="bars" fill="#000">
    <rect x="0.8" y="6.3" width="2.6" height="5.4" rx="1.3"/>
    <rect x="4.4" y="4.3" width="2.6" height="9.4" rx="1.3"/>
    <rect x="8" y="2.3" width="2.6" height="13.4" rx="1.3"/>
  </g>
  <g id="cursor" fill="#000">
    <rect x="13.4" y="2" width="2.2" height="14" rx="1.1"/>
    <rect x="11.4" y="1.4" width="6.2" height="2.2" rx="1.1"/>
    <rect x="11.4" y="14.4" width="6.2" height="2.2" rx="1.1"/>
  </g>
</svg>
